# ==============================================================================
# PostgreSQL Client Authentication Configuration File (pg_hba.conf)
# NovaLex Tecnología Contractual S.A. de C.V.
# ==============================================================================
# Reglas estrictas de autenticación SCRAM-SHA-256 para todas las conexiones.
# Se eliminan todas las reglas trust (tanto de socket local Unix como de red TCP),
# exigiendo autenticación criptográfica segura en todos los puntos de acceso.

# 1. Conexiones locales del socket Unix (requieren autenticación SCRAM-SHA-256)
local   all             all                                     scram-sha-256

# 2. Conexiones loopback IPv4 e IPv6
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# 3. Replicación local y remota
local   replication     all                                     scram-sha-256
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256

# 4. Todas las conexiones de red (Docker interna y host)
host    all             all             all                     scram-sha-256
