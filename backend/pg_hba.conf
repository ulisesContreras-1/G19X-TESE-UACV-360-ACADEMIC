# PostgreSQL Client Authentication Configuration File
# Configuración para entorno Docker de NovaLex Tecnología Contractual S.A. de C.V.

# Conexiones locales del socket Unix
local   all             all                                     trust

# Conexiones loopback IPv4 e IPv6
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# Replicación
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# Conexión sin contraseña RESTRICTA a la red interna de Docker para la aplicación
host    contratos_db    plurione        172.16.0.0/12           trust
host    contratos_db    plurione        samenet                 trust

# Cualquier otra conexión externa requiere autenticación
host    all             all             all                     scram-sha-256
