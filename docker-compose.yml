# ==============================================================================
# MOTOR INTELIGENTE DE GENERACIÓN AUTOMÁTICA DE CONTRATOS - NOVALEX TECNOLOGÍA CONTRACTUAL S.A. DE C.V.
# Orquestación de Microservicios Locales con Docker Compose (PRD Sección 6 y 9)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend: Interfaz Web React + Vite (Roles: Generador, Editor, Aprobador)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plurione-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started
    networks:
      - contratos-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 2. Backend: API REST FastAPI (Python 3.11) + WeasyPrint + LangChain
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: plurione-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://plurione@postgres:5432/contratos_db
      - OLLAMA_HOST=http://ollama:11434
      - MODEL_NAME=llama3.1:8b
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - JWT_SECRET=${JWT_SECRET:-4f9c8d2e7a1b3c5e8d9a0f2b4c6e8a1d3f5b7c9e0a2d4f6a8b0c2e4d6f8a0b2c}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - contratos-net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Inteligencia Artificial Local: Ollama con Llama 3.1 8B (Costo $0, datos locales)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: plurione-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - contratos-net
    restart: unless-stopped
    # Descomenta este bloque si cuentas con tarjeta gráfica NVIDIA compatible con CUDA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ----------------------------------------------------------------------------
  # 4. Base de Datos Relacional: PostgreSQL 15
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: plurione-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=plurione
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-novalex_secure_pg_2026}
      - POSTGRES_DB=contratos_db
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plurione -d contratos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - contratos-net
    restart: unless-stopped

# ------------------------------------------------------------------------------
# Volúmenes Persistentes
# ------------------------------------------------------------------------------
volumes:
  pgdata:
    driver: local
  ollama_data:
    driver: local

# ------------------------------------------------------------------------------
# Red Interna Bridge
# ------------------------------------------------------------------------------
networks:
  contratos-net:
    driver: bridge
